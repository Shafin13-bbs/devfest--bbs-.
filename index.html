<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smart Escape</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#16233b;--mut:#5d6b82;--bg:#f2f5f9;--card:#fff;--line:#d9e0ea;--route:#1d5fd1;--ok:#158a63;--bad:#c93b3b;--warn:#b9770e}
*{box-sizing:border-box}
body{margin:0;font-family:"Hind Siliguri",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}
header{background:var(--ink);color:#fff;padding:14px 20px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
header h1{margin:0;font-size:1.5rem;font-weight:700}
header p{margin:0;color:#b8c4d9;font-size:.9rem}
.lang button{border:1px solid #5b6c8a;background:transparent;color:#fff;padding:6px 14px;cursor:pointer;font:inherit}
.lang button:first-child{border-radius:8px 0 0 8px}.lang button:last-child{border-radius:0 8px 8px 0}
.lang button.on{background:#fff;color:var(--ink);font-weight:600}
main{display:grid;grid-template-columns:340px 1fr;gap:16px;padding:16px;max-width:1300px;margin:auto}
@media(max-width:900px){main{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:14px}
.card h2{margin:0 0 8px;font-size:1.05rem;display:flex;align-items:center;gap:8px}
.card h2 i{font-style:normal;background:var(--ink);color:#fff;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:.8rem}
.hint{color:var(--mut);font-size:.88rem;margin:4px 0 8px}
button,select{font:inherit}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 12px;cursor:pointer;color:var(--ink)}
.btn:hover{border-color:var(--route)}
.btn.primary{background:var(--route);border-color:var(--route);color:#fff}
.btn:focus-visible,select:focus-visible,svg g:focus-visible{outline:3px solid #7aa7f5;outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:8px}
select{width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;background:#fff}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:6px}
.seg button{flex:1;border:0;background:#fff;padding:8px;cursor:pointer;color:var(--ink)}
.seg button.on{background:var(--ink);color:#fff}
.errs{background:#fdecec;border:1px solid #f0b8b8;color:#8a1f1f;border-radius:8px;padding:8px 12px;margin-bottom:14px;font-size:.9rem}
.errs ul{margin:4px 0 0;padding-left:18px}
.status{border-radius:10px;padding:12px 14px;font-weight:600;border-left:6px solid var(--mut);background:#eef2f7;transition:background .25s,border-color .25s}
.status.ok{background:#e6f5ee;border-color:var(--ok)}
.status.bad{background:#fdecec;border-color:var(--bad)}
.status.idle{background:#fff6e3;border-color:var(--warn)}
.path{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin:10px 0 0;font-weight:500}
.path span{background:#e8f0fd;border-radius:6px;padding:2px 9px}
.path em{color:var(--mut);font-style:normal}
.facts{display:flex;gap:18px;margin-top:8px;font-size:.95rem;color:var(--mut)}.facts b{color:var(--ink);font-size:1.1rem}
.mapbox{background:#fff;border:1px solid var(--line);border-radius:12px;padding:6px;overflow:auto}
svg{width:100%;height:auto;max-height:70vh;display:block}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.85rem;color:var(--mut);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:16px;height:16px;border:2px solid var(--ink);display:inline-block;background:#fff}
.edge{stroke:#aab6c8;stroke-width:3;transition:stroke .25s}
.edge.route{stroke:var(--route);stroke-width:6;stroke-dasharray:600;animation:draw .5s ease-out forwards}
.edge.blocked{stroke:var(--bad);stroke-dasharray:8 6}
.hit{stroke:transparent;stroke-width:22;cursor:pointer}
.node{cursor:pointer}
.node .inner{transition:transform .15s}.node:hover .inner{transform:scale(1.07)}
.node .sh{stroke:var(--ink);stroke-width:2.5;transition:fill .25s}
.room .sh{fill:#e3ebf7}.junction .sh{fill:#fff}.exit .sh{fill:#d5f1e5;stroke:var(--ok);stroke-width:3.5}
.blocked .sh{fill:#f4c4c4;stroke:var(--bad)}
.closed .sh{fill:#d9dde3;stroke:#7b8494;stroke-dasharray:5 3}
.inroute .sh{stroke:var(--route);stroke-width:4}
.isstart .sh{fill:#ffe9a8;stroke:var(--warn);stroke-width:4}
.pop{animation:pop .35s ease-out}
.cost rect{fill:#fff;stroke:var(--line)}.cost text{font-size:12px;font-weight:600;fill:var(--ink)}
.lbl{font-size:13px;font-weight:600;text-anchor:middle;pointer-events:none;fill:var(--ink)}
.tag{font-size:10px;text-anchor:middle;pointer-events:none;fill:var(--mut)}
@keyframes draw{from{stroke-dashoffset:600}to{stroke-dashoffset:0}}
@keyframes pop{0%{transform:scale(.8)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

html{scroll-behavior:smooth;scroll-padding-top:72px}
.nav{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 24px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.15rem;color:var(--ink);text-decoration:none}
.logo{width:34px;height:34px;border-radius:9px;background:var(--ink);display:grid;place-items:center}
.links{display:flex;gap:6px}.links a{color:var(--mut);text-decoration:none;padding:6px 12px;border-radius:8px;font-weight:500}.links a:hover{background:var(--bg);color:var(--ink)}
@media(max-width:700px){.links{display:none}.nav{padding:10px 14px}}
.nav .lang button{color:var(--ink);border-color:var(--line)}.nav .lang button.on{background:var(--ink);color:#fff}
.hero{background:linear-gradient(135deg,#142038,#1d3a6e);color:#fff;padding:56px 24px}
.hero .in{max-width:1100px;margin:auto;display:grid;grid-template-columns:1.2fr 1fr;gap:32px;align-items:center}
@media(max-width:800px){.hero .in{grid-template-columns:1fr}.hero{padding:36px 18px}}
.hero h1{font-size:clamp(1.9rem,4vw,2.8rem);line-height:1.2;margin:0 0 14px}
.hero p{color:#c8d4ea;font-size:1.08rem;max-width:520px;margin:0 0 22px}
.hero .btn{padding:11px 20px;font-weight:600}.hero .btn.ghost{background:transparent;color:#fff;border-color:#6d82a8;margin-left:6px}
.hero svg{max-height:210px;background:rgba(255,255,255,.07);border-radius:16px;padding:10px}
.wrap{max-width:1100px;margin:auto;padding:44px 20px 8px}
.sechead{max-width:1300px;margin:auto;padding:30px 16px 0}
.sechead h2,.wrap h2{margin:0 0 4px;font-size:1.6rem}.sechead p,.wrap>p{color:var(--mut);margin:0}
.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-top:20px}
.how .card{margin:0}.how b{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:50%;background:var(--route);color:#fff;margin-bottom:8px}
.how h3{margin:0 0 4px;font-size:1.05rem}.how p{margin:0;color:var(--mut);font-size:.93rem}
details{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 16px;margin-top:10px}
summary{cursor:pointer;font-weight:600}details p{margin:8px 0 0;color:var(--mut)}
footer{margin-top:44px;background:var(--ink);color:#b8c4d9;text-align:center;padding:24px 16px;font-size:.92rem}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{border:1px solid #f0b8b8;background:#fdecec;color:#8a1f1f;border-radius:99px;padding:3px 10px;cursor:pointer;font-size:.85rem}
.chip.x{border-color:#c3c9d3;background:#eceff3;color:#4a5568}.chip:hover{filter:brightness(.95)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.stats div{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 12px;color:var(--mut);font-size:.85rem}.stats b{display:block;font-size:1.3rem;color:var(--ink)}
.dirs h3{margin:14px 0 4px;font-size:.98rem}.dirs ol{margin:0;padding-left:20px}.dirs li{margin:2px 0}.dirs small{color:var(--mut)}
</style>
</head>

  <section>

      <div id="path" class="path"></div>
      <div id="facts" class="facts"></div>

    </div>
    <div class="stats" id="stats"></div>
    <div class="mapbox"><svg id="map" role="img"></svg></div>
    <div class="legend" id="legend"></div>
  </section>
</main>

q3:"কোন ফাইল ইমপোর্ট করা যায়?",a3:"building, nodes, edges ও initial_state সহ একটি JSON ফাইল। ভুল ফাইলে স্পষ্ট ত্রুটি দেখানো হয়।",
q4:"এটি কি বাস্তব জরুরি অবস্থার জন্য?",a4:"না। স্মার্ট এস্কেপ একটি শিক্ষামূলক সিমুলেশন, প্রত্যয়িত সরিয়ে নেওয়ার পরিকল্পনা টুল নয়।",
foot:"স্মার্ট এস্কেপ: একটি শিক্ষামূলক সরিয়ে নেওয়ার রুট সিমুলেটর। বাস্তব জরুরি অবস্থার জন্য নয়।",sub:"ইন্টারঅ্যাকটিভ সরিয়ে নেওয়ার রুট সিমুলেটর (শিক্ষামূলক, বাস্তব জরুরি অবস্থার জন্য নয়)",
s1:"ভবন লোড করুন",s1h:"building.json ফাইল ইমপোর্ট করুন, অথবা বিল্ট-ইন নমুনা ব্যবহার করুন।",imp:"building.json ইমপোর্ট",sample:"নমুনা লোড করুন",
s2:"শুরুর স্থান বেছে নিন",s2h:"এখান থেকে অথবা মানচিত্রে ক্লিক করে একটি রুম বা জাংশন বেছে নিন।",pick:"শুরুর স্থান নির্বাচন করুন…",
s3:"বিপদ পরিবর্তন করুন",s3h:"বিপদ মোডে গিয়ে রুম, জাংশন, করিডর বা এক্সিটে ক্লিক করে বন্ধ/চালু করুন।",
mStart:"শুরু নির্ধারণ",mHaz:"বিপদ পরিবর্তন",reset:"মূল অবস্থায় ফিরুন",
building:"ভবন: {0}",noStart:"সবচেয়ে কম খরচের রুট দেখতে একটি শুরুর স্থান বেছে নিন।",
blockedStart:"শুরুর স্থান বন্ধ",noRoute:"কোনো রুট পাওয়া যায়নি",found:"রুট পাওয়া গেছে",
cost:"মোট খরচ",exit:"এক্সিট",steps:"করিডর",
exitStart:"এক্সিট শুরুর স্থান হতে পারে না। রুম বা জাংশন বেছে নিন।",
lRoom:"রুম",lJun:"জাংশন",lExit:"এক্সিট",lBN:"বন্ধ রুম/জাংশন",lBE:"বন্ধ করিডর",lCX:"বন্ধ এক্সিট",lSt:"শুরু",lRt:"সেরা রুট",
tBlock:"বন্ধ",tClosed:"বন্ধ",tStart:"শুরু",
errTitle:"এই ফাইলটি ব্যবহার করা যাচ্ছে না:",
e_json:"ফাইলটি সঠিক JSON নয়।",e_obj:"ফাইলে একটি JSON অবজেক্ট থাকতে হবে।",e_bld:"“building” একটি খালি নয় এমন নাম হতে হবে।",
e_nodes:"“nodes” এ ২–৬০টি আইটেম থাকতে হবে।",e_edges:"“edges” এ ১–১৫০টি আইটেম থাকতে হবে।",
e_node:"নোড #{0} সঠিক নয় (id, label, type, সংখ্যাসূচক x ও y দরকার)।",
e_nid:"নোড আইডি “{0}” পুনরাবৃত্ত হয়েছে।",e_eid:"এজ আইডি “{0}” পুনরাবৃত্ত হয়েছে।",
e_edge:"এজ #{0} সঠিক নয় (id, from, to ও ধনাত্মক পূর্ণসংখ্যা cost দরকার)।",
e_end:"এজ “{0}” একটি অজানা নোডে যাচ্ছে।",e_loop:"এজ “{0}” নিজের সাথেই যুক্ত।",e_pair:"এজ “{0}” একই নোড-জোড়া পুনরাবৃত্তি করেছে।",
e_types:"কমপক্ষে একটি রুম/জাংশন ও একটি এক্সিট থাকতে হবে।",
e_state:"“initial_state” এ blocked_nodes, blocked_edges ও closed_exits অ্যারে দরকার।",
e_sn:"blocked_nodes এর “{0}” রুম বা জাংশন নয়।",e_se:"blocked_edges এ অজানা এজ “{0}” আছে।",e_sx:"closed_exits এর “{0}” এক্সিট নয়।"
}};

const $=s=>document.querySelector(s);
let lang="en",data=null,type={},bN=new Set,bE=new Set,cX=new Set,start=null,mode="start",errs=[],note=null,changed=null;
const t=(k,...a)=>(L[lang][k]||k).replace(/\{(\d)\}/g,(_,i)=>a[i]);
const isStr=v=>typeof v==="string"&&v.trim()!=="";

function validate(d){
  const E=[],e=(k,...a)=>E.push([k,a]);
  if(!d||typeof d!=="object"||Array.isArray(d)){e("e_obj");return E}
  if(!isStr(d.building))e("e_bld");
  if(!Array.isArray(d.nodes)||d.nodes.length<2||d.nodes.length>60)e("e_nodes");
  if(!Array.isArray(d.edges)||d.edges.length<1||d.edges.length>150)e("e_edges");
  if(E.length)return E;
  const ids=new Map,eids=new Set,pairs=new Set;
  d.nodes.forEach((n,i)=>{
    if(!n||!isStr(n.id)||!isStr(n.label)||!["room","junction","exit"].includes(n.type)||typeof n.x!=="number"||typeof n.y!=="number"||!isFinite(n.x)||!isFinite(n.y))return e("e_node",i+1);
    if(ids.has(n.id))return e("e_nid",n.id);ids.set(n.id,n.type)});
  if(![...ids.values()].some(v=>v!=="exit")||![...ids.values()].includes("exit"))e("e_types");
  d.edges.forEach((x,i)=>{
    if(!x||!isStr(x.id)||!isStr(x.from)||!isStr(x.to)||!Number.isInteger(x.cost)||x.cost<=0)return e("e_edge",i+1);
    if(eids.has(x.id))e("e_eid",x.id);eids.add(x.id);
    if(!ids.has(x.from)||!ids.has(x.to))return e("e_end",x.id);
    if(x.from===x.to)return e("e_loop",x.id);
    const k=JSON.stringify([x.from,x.to].sort());if(pairs.has(k))e("e_pair",x.id);pairs.add(k)});
  const s=d.initial_state;
  if(!s||!Array.isArray(s.blocked_nodes)||!Array.isArray(s.blocked_edges)||!Array.isArray(s.closed_exits))e("e_state");
  else{
    s.blocked_nodes.forEach(id=>{if(!ids.has(id)||ids.get(id)==="exit")e("e_sn",id)});
    s.blocked_edges.forEach(id=>{if(!eids.has(id))e("e_se",id)});
    s.closed_exits.forEach(id=>{if(ids.get(id)!=="exit")e("e_sx",id)})}
  return E}

function load(d){
  data=d;type={};d.nodes.forEach(n=>type[n.id]=n.type);start=null;note=null;changed=null;
  resetState();buildSelect();render()}
function resetState(){const s=data.initial_state;bN=new Set(s.blocked_nodes);bE=new Set(s.blocked_edges);cX=new Set(s.closed_exits)}

function dijk(adj,src,banExits){
  const d=Object.create(null),done=new Set;data.nodes.forEach(n=>d[n.id]=Infinity);d[src]=0;
  for(;;){
    let u=null;for(const k in d)if(!done.has(k)&&d[k]<Infinity&&(u===null||d[k]<d[u]))u=k;
    if(u===null)break;done.add(u);
    if(type[u]==="exit"&&u!==src)continue;
    for(const[v,w]of adj[u]){if(banExits&&type[v]==="exit"&&v!==src)continue;if(d[u]+w<d[v])d[v]=d[u]+w}}
  return d}

function solve(){
  if(!start)return{s:"idle"};
  if(bN.has(start))return{s:"blocked"};
  const adj=Object.create(null);data.nodes.forEach(n=>adj[n.id]=[]);
  data.edges.forEach(e=>{
    if(bE.has(e.id)||bN.has(e.from)||bN.has(e.to)||cX.has(e.from)||cX.has(e.to))return;
    adj[e.from].push([e.to,e.cost]);adj[e.to].push([e.from,e.cost])});
  const d=dijk(adj,start,false);
  let best=null;
  data.nodes.filter(n=>n.type==="exit"&&!cX.has(n.id)&&d[n.id]<Infinity).forEach(n=>{
    if(best===null||d[n.id]<d[best]||(d[n.id]===d[best]&&n.id<best))best=n.id});
  if(best===null)return{s:"none"};
  const r=dijk(adj,best,true),path=[start];let cur=start;
  while(cur!==best){
    let nx=null;
    for(const[v,w]of adj[cur])if(r[v]+w===r[cur]&&(nx===null||v<nx))nx=v;
    path.push(nx);cur=nx}
  return{s:"ok",path,exit:best,cost:d[best]}}

function buildSelect(){
  const sel=$("#startSel");
  sel.innerHTML=`<option value="">${t("pick")}</option>`+data.nodes.filter(n=>n.type!=="exit")
    .map(n=>`<option value="${esc(n.id)}"${n.id===start?" selected":""}>${esc(n.label)} (${esc(n.id)})</option>`).join("")}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function render(){
  document.documentElement.lang=lang;
  document.querySelectorAll("[data-i]").forEach(el=>el.textContent=t(el.dataset.i));
  $("#en").classList.toggle("on",lang==="en");$("#bn").classList.toggle("on",lang==="bn");
  $("#mStart").classList.toggle("on",mode==="start");$("#mHaz").classList.toggle("on",mode==="haz");
  $("#errs").innerHTML=errs.length?`<div class="errs" role="alert"><b>${t("errTitle")}</b><ul>${errs.map(([k,a])=>`<li>${esc(t(k,...a))}</li>`).join("")}</ul></div>`:"";
  $("#legend").innerHTML=`<span><i class="sw" style="border-radius:3px;background:#e3ebf7"></i>${t("lRoom")}</span><span><i class="sw" style="border-radius:50%"></i>${t("lJun")}</span><span><i class="sw" style="border-radius:50%;border-color:var(--ok);background:#d5f1e5"></i>${t("lExit")}</span><span><i class="sw" style="background:#f4c4c4;border-color:var(--bad)"></i>${t("lBN")}</span><span><i class="sw" style="border:0;border-top:3px dashed var(--bad);height:0;width:22px"></i>${t("lBE")}</span><span><i class="sw" style="background:#d9dde3;border-style:dashed;border-color:#7b8494"></i>${t("lCX")}</span><span><i class="sw" style="background:#ffe9a8;border-color:var(--warn)"></i>${t("lSt")}</span><span><i class="sw" style="border:0;border-top:5px solid var(--route);height:0;width:22px"></i>${t("lRt")}</span>`;
  if(!data){$("#map").innerHTML="";$("#status").className="status idle";$("#status").textContent=t("noStart");$("#path").innerHTML="";$("#facts").innerHTML="";return}
  $("#bname").textContent=t("building",data.building);
  $("#startSel").options[0].textContent=t("pick");
  const R=solve(),pn=new Set(R.path||[]),pe=new Set,segs=[];
  if(R.path)for(let i=0;i<R.path.length-1;i++){const a=R.path[i],b=R.path[i+1];
    const e=data.edges.find(e=>(e.from===a&&e.to===b)||(e.from===b&&e.to===a));if(e&&!bE.has(e.id)){pe.add(e.id);segs.push([a,b,e.cost])}}
  const st=$("#status"),P=$("#path"),F=$("#facts");P.innerHTML="";F.innerHTML="";
  if(R.s==="ok"){st.className="status ok";st.textContent="✓ "+t("found");
    P.innerHTML=R.path.map(id=>`<span>${esc(id)}</span>`).join("<em>›</em>");
    F.innerHTML=`<div>${t("cost")}<br><b>${R.cost}</b></div><div>${t("exit")}<br><b>${esc(R.exit)}</b></div><div>${t("steps")}<br><b>${R.path.length-1}</b></div>`}
  else if(R.s==="blocked"){st.className="status bad";st.textContent="⚠ "+t("blockedStart")}
  else if(R.s==="none"){st.className="status bad";st.textContent="✕ "+t("noRoute")}
  else{st.className="status idle";st.textContent=note?t(note):t("noStart")}
  $("#dirs").innerHTML=R.s==="ok"?`<h3>${t("dirT")}</h3><ol>${segs.map(g=>`<li>${esc(t("dirGo",g[0],g[1]))} <small>(${t("cost")} ${g[2]})</small></li>`).join("")}</ol>`:"";
  const hz=[...bN].map(i=>["n",i,t("lBN")]).concat([...bE].map(i=>["e",i,t("lBE")]),[...cX].map(i=>["x",i,t("lCX")]));
  $("#hz").innerHTML=hz.length?hz.map(h=>`<button class="chip${h[0]==="x"?" x":""}" data-h="${h[0]}" data-id="${esc(h[1])}">${esc(h[1])}: ${h[2]} ✕</button>`).join(""):`<span class="hint">${t("hzNone")}</span>`;
  $("#stats").innerHTML=`<div>${t("stN")}<b>${data.nodes.length}</b></div><div>${t("stE")}<b>${data.edges.length}</b></div><div>${t("stX")}<b>${data.nodes.filter(n=>n.type==="exit"&&!cX.has(n.id)).length}</b></div>`;
  const xs=data.nodes.map(n=>n.x),ys=data.nodes.map(n=>n.y),pad=70;
  const x0=Math.min(...xs)-pad,y0=Math.min(...ys)-pad,w=Math.max(...xs)-Math.min(...xs)+2*pad,h=Math.max(...ys)-Math.min(...ys)+2*pad;
  const N=Object.fromEntries(data.nodes.map(n=>[n.id,n]));
  let s="";
  data.edges.forEach(e=>{
    const a=N[e.from],b=N[e.to],mx=(a.x+b.x)/2,my=(a.y+b.y)/2,bl=bE.has(e.id);
    s+=`<g data-e="${esc(e.id)}" style="cursor:pointer" tabindex="0" role="button" aria-label="${esc(e.id)} ${e.cost}">
    <line class="edge${pe.has(e.id)?" route":""}${bl?" blocked":""}" x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}"/>
    <line class="hit" x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}"/>
    <g class="cost${changed===e.id?" pop":""}" style="transform-origin:${mx}px ${my}px"><rect x="${mx-16}" y="${my-11}" width="32" height="22" rx="7"/><text x="${mx}" y="${my+4}" text-anchor="middle">${e.cost}</text></g>
    ${bl?`<text x="${mx}" y="${my-18}" text-anchor="middle" font-size="14" fill="var(--bad)" font-weight="700">✕ ${t("tBlock")}</text>`:""}</g>`});
  data.nodes.forEach(n=>{
    const bl=bN.has(n.id),cl=cX.has(n.id),cls=[n.type,bl?"blocked":"",cl?"closed":"",pn.has(n.id)?"inroute":"",n.id===start?"isstart":""].join(" ");
    const shape=n.type==="room"?`<rect class="sh" x="-26" y="-20" width="52" height="40" rx="9"/>`:n.type==="exit"?`<rect class="sh" x="-30" y="-22" width="60" height="44" rx="22"/>`:`<circle class="sh" r="21"/>`;
    const tag=bl?t("tBlock"):cl?t("tClosed"):n.id===start?t("tStart"):"";
    s+=`<g class="node ${cls}" data-n="${esc(n.id)}" tabindex="0" role="button" aria-label="${esc(n.label)}" style="transform-origin:${n.x}px ${n.y}px;transform:translate(${n.x}px,${n.y}px)"><g class="inner${changed===n.id?" pop":""}">${shape}
    <text class="lbl" y="5">${esc(n.label.length>8?n.id:n.label)}</text>${tag?`<text class="tag" y="38" fill="var(--bad)">${tag}</text>`:""}</g></g>`});
  const m=$("#map");m.setAttribute("viewBox",`${x0} ${y0} ${w} ${h}`);m.setAttribute("aria-label",data.building);m.innerHTML=s;
  changed=null}

function nodeClick(id){
  if(mode==="start"){
    if(type[id]==="exit"){note="exitStart";start=null;$("#startSel").value=""}
    else{note=null;start=id;$("#startSel").value=id}
  }else{
    note=null;changed=id;
    const set=type[id]==="exit"?cX:bN;set.has(id)?set.delete(id):set.add(id)}
  render()}
function edgeClick(id){
  if(mode==="start")return;
  note=null;changed=id;bE.has(id)?bE.delete(id):bE.add(id);render()}

$("#map").addEventListener("click",e=>{
  const n=e.target.closest("[data-n]"),g=e.target.closest("[data-e]");
  if(n)nodeClick(n.dataset.n);else if(g)edgeClick(g.dataset.e)});
$("#map").addEventListener("keydown",e=>{
  if(e.key!=="Enter"&&e.key!==" ")return;e.preventDefault();
  const n=e.target.closest("[data-n]"),g=e.target.closest("[data-e]");
  if(n)nodeClick(n.dataset.n);else if(g)edgeClick(g.dataset.e)});
$("#hz").onclick=e=>{const b=e.target.closest("[data-h]");if(!b)return;const k=b.dataset.h,id=b.dataset.id;(k==="n"?bN:k==="e"?bE:cX).delete(id);note=null;render()};
$("#startSel").onchange=e=>{start=e.target.value||null;note=null;render()};
$("#mStart").onclick=()=>{mode="start";render()};
$("#mHaz").onclick=()=>{mode="haz";render()};
$("#reset").onclick=()=>{if(!data)return;resetState();note=null;render()};
$("#sample").onclick=()=>{errs=[];load(JSON.parse(JSON.stringify(SAMPLE)))};
$("#en").onclick=()=>{lang="en";render()};$("#bn").onclick=()=>{lang="bn";render()};
$("#file").onchange=ev=>{
  const f=ev.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    let d;try{d=JSON.parse(r.result)}catch{errs=[["e_json",[]]];render();return}
    errs=validate(d);
    if(!errs.length)load(d);else render()};
  r.readAsText(f);ev.target.value=""};

errs=[];load(JSON.parse(JSON.stringify(SAMPLE)));
</script>
</body>
</html>
